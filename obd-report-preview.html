<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Smart Library · Add New Car</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#121923;background:#eef2f4;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:#eef2f4}button,input,select{font:inherit}button{cursor:pointer}
    .topbar{height:78px;padding:0 max(32px,calc((100vw - 580px)/2));display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #dce1e5}
    .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:#edf1f3;color:#172c40}.logo svg{width:28px;height:28px}.brand{font-size:20px;font-weight:720;letter-spacing:-.035em}
    main{width:min(100% - 120px,1100px);margin:36px auto 64px}.page-heading{margin:0 0 28px;font-size:clamp(30px,4vw,38px);line-height:1.15;letter-spacing:-.045em;color:#111923}
    .workspace{display:grid;grid-template-columns:minmax(190px,.72fr) minmax(280px,1fr);align-items:start;gap:28px}.input-column{min-width:0}.column-title{margin:0 0 13px;font-size:20px;font-weight:700;letter-spacing:-.025em}
    .drop-zone{min-height:158px;display:grid;place-items:center;padding:18px;border:1.5px dashed #a8b3ba;border-radius:15px;background:#f4f6f7;text-align:center;transition:background .15s,border-color .15s,box-shadow .15s}
    .drop-zone:hover,.drop-zone.dragging{border-color:#2873cb;background:#eff6ff;box-shadow:inset 0 0 0 2px #2873cb19}.drop-zone:focus-visible{outline:3px solid #2873cb55}
    .upload-icon{color:#64717c;margin:0 auto 6px}.drop-title{margin:0;color:#1f2a33;font-weight:700}.drop-subtitle{margin:3px 0 9px;color:#59656e;font-size:.86rem}.choose-file{border:0;background:transparent;color:#1762ac;font-weight:700;padding:2px 5px;text-decoration:underline;text-underline-offset:2px}
    .file-name{max-width:100%;margin:8px 0 0;color:#62707a;font-size:.78rem;overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .scan-button{width:100%;min-height:43px;margin:13px 0 15px;border:0;border-radius:8px;background:#286abd;color:#fff;font-weight:730;box-shadow:0 2px 4px #142d4c2e}.scan-button:hover{background:#205da8}.scan-button:disabled,.add-button:disabled{opacity:.65;cursor:wait}
    .language-mini{width:74px;height:32px;padding:0 4px;border:1px solid #d6dde2;border-radius:7px;background:#fff;color:#384650;font-size:.68rem}.language-mini:focus{outline:3px solid #2675cf30;border-color:#2876cf}.custom-language{width:100%;height:35px;margin:0 0 10px;padding:7px 10px;border:1px solid #d6dde2;border-radius:7px;background:#fff;color:#202a32;font-size:.8rem}.field label{font-size:.88rem;font-weight:680;color:#202a32}.field input{width:100%;height:42px;padding:9px 11px;border:1px solid #b9c2c8;border-radius:7px;background:#fff;color:#202a32}.field input:focus{outline:3px solid #2675cf30;border-color:#2876cf}
    .field{display:grid;gap:6px;margin-top:12px}.field input{height:41px}.id-label{margin:0 0 3px;color:#303942;font-size:.89rem}.amount-wrap{display:flex;height:41px;border:1px solid #b9c2c8;border-radius:7px;background:#fff;overflow:hidden}.amount-wrap:focus-within{outline:3px solid #2675cf30;border-color:#2876cf}.currency{display:grid;place-items:center;width:39px;flex:none;border-right:1px solid #e0e4e7;color:#59636a}.amount-wrap input{width:auto;min-width:0;flex:1;height:39px;border:0;border-radius:0;outline:0!important;box-shadow:none!important}
    .add-button{width:100%;min-height:44px;margin-top:17px;border:0;border-radius:8px;background:#153d5d;color:#fff;font-weight:720}.add-button:hover{background:#0f304c}.result-message{margin-top:12px;padding:11px 12px;border-radius:8px;font-size:.84rem;line-height:1.5}.result-message.error{border:1px solid #ecc2c2;background:#fff0f0;color:#8b2525}.result-message.success{border:1px solid #c9e4d0;background:#f0f9f2;color:#215d38}.hidden{display:none!important}.report-link{color:#17633d;font-weight:750;text-underline-offset:3px}
    .report-card{min-height:520px;padding:19px 18px 21px;border:1px solid #d5dadd;border-radius:20px;background:#fff;box-shadow:0 8px 14px #172d3b24,0 2px 5px #172d3b10}.report-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px 14px}.report-title{margin:0;font-size:19px;font-weight:720;letter-spacing:-.025em}.report-actions{display:flex;align-items:center;gap:3px}.icon-button{display:grid;place-items:center;width:30px;height:32px;border:1px solid transparent;border-radius:8px;background:transparent;color:#53616a}.icon-button:hover:not(:disabled){border-color:#d8e0e5;background:#f4f7f8;color:#1c5d92}.icon-button:disabled{opacity:.42;cursor:not-allowed}
    .result-list{min-height:363px;padding:0 1px;border:1px solid #d4d8db;border-radius:14px;overflow:hidden}.empty-state{min-height:361px;display:grid;place-content:center;padding:24px;color:#78858e;text-align:center}.empty-state svg{margin:0 auto 12px;color:#9aa5ac}.empty-state p{max-width:270px;margin:0;font-size:.88rem;line-height:1.55}
    .result-item{padding:18px 16px 17px}.result-item+.result-item{border-top:1px solid #d9dddf}.result-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}.code{margin:0;font-size:18px;font-weight:800;letter-spacing:.015em;color:#17202a}.listen-button{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 8px;border:1px solid #d5dee4;border-radius:7px;background:#fff;color:#315b78;font-size:.75rem;font-weight:700}.listen-button:hover{background:#eef5f8}.meaning{margin:0;color:#323a41;font-size:.89rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.finding-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.finding-tags span{padding:3px 8px;border-radius:999px;background:#eef2f4;color:#65727a;font-size:.69rem}
    .report-foot{display:flex;justify-content:space-between;gap:12px;margin:12px 3px 0;color:#879198;font-size:.72rem;line-height:1.4}.sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:640px){.topbar{height:68px;padding:0 20px}main{width:min(100% - 32px,560px);margin-top:27px}.workspace{grid-template-columns:1fr;gap:26px}.page-heading{margin-bottom:22px}.report-card{min-height:420px}.result-list,.empty-state{min-height:280px}.report-card{padding:16px 14px}}
    @media(max-width:420px){.topbar{padding:0 16px}.brand{font-size:18px}main{width:min(100% - 24px,560px)}.report-heading{align-items:flex-start;flex-wrap:wrap}.report-actions{gap:3px}}
  </style>
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="3" y="7" width="26" height="19" rx="6" fill="#162c40"/><path d="M8 7 10 4h12l2 3" stroke="#162c40" stroke-width="2" stroke-linecap="round"/><path d="M7 14h4l2-3 3 9 3-6 2 3h4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="27" r="2" fill="#162c40"/><circle cx="23" cy="27" r="2" fill="#162c40"/></svg></span>
    <span class="brand">Smart Library</span>
  </header>
  <main>
    <h1 class="page-heading">Add New Car</h1>
    <div class="workspace">
      <section class="input-column" aria-labelledby="inputHeading">
        <h2 id="inputHeading" class="column-title">Input/Upload</h2>
        <form id="scanForm">
          <input id="fileInput" class="sr-only" type="file" accept=".txt,.csv,.log,.pdf,.jpg,.jpeg,.png,.webp" aria-label="Choose diagnostic file">
          <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="Drag and drop a diagnostic file or choose one">
            <div>
              <div class="upload-icon" aria-hidden="true"><svg width="42" height="36" viewBox="0 0 42 36" fill="none"><path d="M12 28h-1a7 7 0 0 1-.5-14A10.5 10.5 0 0 1 31 12a8 8 0 0 1 1 16h-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M21 29V16m0 0-5 5m5-5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              <p class="drop-title">Drag &amp; drop file</p>
              <p class="drop-subtitle">or choose file to upload</p>
              <button id="chooseFile" class="choose-file" type="button">Choose file</button>
              <p id="fileName" class="file-name">No file selected</p>
            </div>
          </div>
          <button id="analyzeButton" class="scan-button" type="submit">Scan</button>
        </form>
        <form id="customerForm">
          <p id="carIdLabel" class="id-label">ID (…)</p>
          <div class="field"><label for="customerName">Name</label><input id="customerName" name="name" autocomplete="name" maxlength="100" placeholder="Name" required></div>
          <div class="field"><label for="customerPhone">Pass / Phone</label><input id="customerPhone" name="phone" type="text" autocomplete="tel" maxlength="80" placeholder="Pass / Phone" required></div>
          <div class="field"><label for="customerAmount">Amount</label><div class="amount-wrap"><span class="currency" aria-hidden="true">₹</span><input id="customerAmount" name="amount" type="number" min="0" max="1000000000" step="0.01" inputmode="decimal" aria-label="Amount in rupees" required></div></div>
          <button id="addCarButton" class="add-button" type="submit">Add New Car</button>
        </form>
        <div id="errorMessage" class="result-message error hidden" role="alert"></div>
        <div id="successMessage" class="result-message success hidden" role="status" aria-live="polite"></div>
      </section>

      <section class="report-card" aria-labelledby="reportHeading">
        <div class="report-heading">
          <h2 id="reportHeading" class="report-title">OBD Report</h2>
          <div class="report-actions">
            <select id="language" class="language-mini" aria-label="Explanation language" title="Explanation language">
              <option>English</option><option>Hindi</option><option>Hinglish</option><option>Urdu</option><option>Bengali</option><option>Marathi</option><option>Gujarati</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Malayalam</option><option>Punjabi</option><option>Spanish</option><option>French</option><option>Arabic</option><option>Portuguese</option><option>German</option><option>Japanese</option><option>Chinese</option><option>Other</option>
            </select>
            <button id="listenAllButton" class="icon-button" type="button" aria-label="Listen to all findings" title="Listen to all findings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
            <button id="downloadButton" class="icon-button" type="button" aria-label="Download PDF report" title="Download PDF report" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8V4h10v4M6 17H4V9h16v8h-2M7 14h10v7H7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 11h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          </div>
        </div>
        <input id="customLanguage" class="custom-language hidden" maxlength="40" placeholder="Enter language, e.g. Swahili" aria-label="Enter explanation language">
        <div id="resultList" class="result-list" aria-live="polite">
          <div id="emptyState" class="empty-state"><div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.8h7l4 4V20a1.2 1.2 0 0 1-1.2 1.2H7A1.2 1.2 0 0 1 5.8 20V5A1.2 1.2 0 0 1 7 3.8Z" stroke="currentColor" stroke-width="1.5"/><path d="M14 4v4h4M8.5 13h7M8.5 16h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><p>Upload a diagnostic file and select <strong>Scan</strong>. Codes and their explanations will appear here.</p></div></div>
        </div>
        <div class="report-foot"><span id="scanSummary">Waiting for a diagnostic file</span><span>AI generated · verify before repair</span></div>
      </section>
    </div>
    <div id="liveStatus" class="sr-status" aria-live="polite"></div>
  </main>
  <script>
    const API_BASE = location.protocol === "file:" ? "http://localhost:4000" : "";
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const fileName = document.getElementById("fileName");
    const languageSelect = document.getElementById("language");
    const customLanguage = document.getElementById("customLanguage");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const resultList = document.getElementById("resultList");
    const emptyState = document.getElementById("emptyState");
    let currentFindings = [];
    let currentAnalysisId = null;
    let reportDownloadUrl = null;

    function selectedLanguage(){return languageSelect.value==="Other"?customLanguage.value.trim():languageSelect.value}
    function showError(message){errorMessage.textContent=message;errorMessage.classList.remove("hidden");successMessage.classList.add("hidden")}
    function clearMessages(){errorMessage.classList.add("hidden");successMessage.classList.add("hidden")}
    function clearFindings(){currentFindings=[];currentAnalysisId=null;reportDownloadUrl=null;document.getElementById("downloadButton").disabled=true;resultList.replaceChildren(emptyState);document.getElementById("scanSummary").textContent="Waiting for a diagnostic file";clearMessages()}
    function setBusy(button,label,busy){button.disabled=busy;button.textContent=label}
    function localeForLanguage(language){const locales={English:"en-US",Hindi:"hi-IN",Hinglish:"hi-IN",Urdu:"ur-PK",Bengali:"bn-IN",Marathi:"mr-IN",Gujarati:"gu-IN",Tamil:"ta-IN",Telugu:"te-IN",Kannada:"kn-IN",Malayalam:"ml-IN",Punjabi:"pa-IN",Spanish:"es-ES",French:"fr-FR",Arabic:"ar-SA",Portuguese:"pt-PT",German:"de-DE",Japanese:"ja-JP",Chinese:"zh-CN"};return locales[language]||"en-US"}
    function speak(text){if(!("speechSynthesis" in window)){showError("Speech playback is not supported by this browser.");return}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=localeForLanguage(selectedLanguage());const voice=window.speechSynthesis.getVoices().find(item=>item.lang.toLowerCase().startsWith(utterance.lang.slice(0,2).toLowerCase()));if(voice)utterance.voice=voice;window.speechSynthesis.speak(utterance)}
    async function loadNextId(){try{const response=await fetch(API_BASE+"/api/next-car-id");const data=await response.json();if(response.ok)document.getElementById("carIdLabel").textContent="ID ("+data.carId+")"}catch{document.getElementById("carIdLabel").textContent="ID (101+)"}}
    function resetOnNewInput(){clearFindings();document.getElementById("scanSummary").textContent=fileInput.files[0]?"Ready to scan":"Waiting for a diagnostic file"}
    document.getElementById("chooseFile").addEventListener("click",event=>{event.stopPropagation();fileInput.click()});
    dropZone.addEventListener("click",event=>{if(!event.target.closest("button"))fileInput.click()});
    dropZone.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();fileInput.click()}});
    ["dragenter","dragover"].forEach(name=>dropZone.addEventListener(name,event=>{event.preventDefault();dropZone.classList.add("dragging")}));
    ["dragleave","drop"].forEach(name=>dropZone.addEventListener(name,event=>{event.preventDefault();dropZone.classList.remove("dragging")}));
    dropZone.addEventListener("drop",event=>{const file=event.dataTransfer.files[0];if(!file)return;const transfer=new DataTransfer();transfer.items.add(file);fileInput.files=transfer.files;fileName.textContent=file.name;resetOnNewInput()});
    fileInput.addEventListener("change",()=>{fileName.textContent=fileInput.files[0]?.name||"No file selected";resetOnNewInput()});
    languageSelect.addEventListener("change",()=>{const value=languageSelect.value;customLanguage.classList.toggle("hidden",value!=="Other");resetOnNewInput()});
    customLanguage.addEventListener("input",resetOnNewInput);

    document.getElementById("scanForm").addEventListener("submit",async event=>{
      event.preventDefault();clearMessages();clearFindings();const file=fileInput.files[0];if(!file){showError("Choose or drop a diagnostic file first.");return}const language=selectedLanguage();if(!language||language==="Other"){showError("Enter the language for the explanation.");return}
      const button=document.getElementById("analyzeButton");setBusy(button,"Reading scan…",true);document.getElementById("scanSummary").textContent="Extracting and explaining fault codes";
      try{const body=new FormData();body.append("file",file);body.append("language",language);const response=await fetch(API_BASE+"/api/analyze-file",{method:"POST",body});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"The diagnostic file could not be analyzed.");currentFindings=Array.isArray(data.codes)?data.codes:[];currentAnalysisId=data.analysisId||null;
        if(!currentFindings.length){document.getElementById("scanSummary").textContent="No codes detected";showError("No readable OBD-II codes were found. Try a clearer scan or a file that includes diagnostic codes.");return}
        resultList.replaceChildren();const rtl=["Urdu","Arabic"].includes(language);
        currentFindings.forEach((item,index)=>{const article=document.createElement("article");article.className="result-item";const top=document.createElement("div");top.className="result-top";const code=document.createElement("h3");code.className="code";code.textContent=item.code;const listen=document.createElement("button");listen.className="listen-button";listen.type="button";listen.textContent="▶ Listen";listen.setAttribute("aria-label","Listen to "+item.code);listen.addEventListener("click",()=>speak(item.code+". "+item.meaning));top.append(code,listen);const meaning=document.createElement("p");meaning.className="meaning";meaning.textContent=item.meaning||"No explanation was returned.";if(rtl)meaning.dir="rtl";article.append(top,meaning);const tags=document.createElement("div");tags.className="finding-tags";["Code meaning","What error it indicates","Common causes"].forEach(label=>{const tag=document.createElement("span");tag.textContent=label;tags.append(tag)});article.append(tags);resultList.append(article)});
        document.getElementById("scanSummary").textContent=currentFindings.length+ (currentFindings.length===1?" fault code found":" fault codes found")+" · "+language;document.getElementById("liveStatus").textContent="Scan complete. "+currentFindings.length+" codes found.";
      }catch(error){document.getElementById("scanSummary").textContent="Scan could not be completed";showError(error instanceof TypeError?"Could not connect to the diagnostic server. Open this page from the running backend and try again.":error.message||"Unable to analyze this file.")}
      finally{setBusy(button,"Scan",false)}
    });

    document.getElementById("listenAllButton").addEventListener("click",()=>{if(!currentFindings.length){showError("Scan a diagnostic file first to listen to the findings.");return}speak(currentFindings.map(row=>row.code+". "+row.meaning).join(". "))});
    document.getElementById("downloadButton").addEventListener("click",()=>{if(reportDownloadUrl)window.location.href=reportDownloadUrl});

    document.getElementById("customerForm").addEventListener("submit",async event=>{
      event.preventDefault();clearMessages();const form=event.currentTarget;if(!form.reportValidity())return;if(!currentFindings.length){showError("Scan the diagnostic file before adding a car.");return}const amount=Number(document.getElementById("customerAmount").value);if(!Number.isFinite(amount)||amount<0){showError("Enter a valid amount.");return}
      const button=document.getElementById("addCarButton");button.disabled=true;button.textContent="Adding car and creating PDF…";
      try{const response=await fetch(API_BASE+"/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("customerName").value,phone:document.getElementById("customerPhone").value,amount,language:selectedLanguage(),analysisId:currentAnalysisId,codes:currentFindings.map(row=>row.code)})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"Could not create the report.");reportDownloadUrl=data.downloadUrl;document.getElementById("downloadButton").disabled=false;const link=document.createElement("a");link.className="report-link";link.href=data.downloadUrl;link.download="OBD-Diagnostic-Report.pdf";link.textContent="Download PDF report";successMessage.replaceChildren(document.createTextNode("Car ID "+data.carId+" added. "),link);successMessage.classList.remove("hidden");document.getElementById("carIdLabel").textContent="ID ("+data.carId+") · saved";document.getElementById("liveStatus").textContent="Car "+data.carId+" added. PDF ready to download.";await loadNextId();
      }catch(error){showError(error instanceof TypeError?"Could not connect to the diagnostic server. Check that the backend is running.":error.message||"Unable to create the report.")}
      finally{button.disabled=false;button.textContent="Add New Car"}
    });
    loadNextId();
  </script>
</body>
</html>
