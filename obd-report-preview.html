<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBD Diagnostic Report</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212f;background:#f1f5f8}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}.page{min-height:100vh;display:grid;place-items:center;padding:32px 16px}.card{width:min(100%,580px);background:white;border:1px solid #e1e8ee;border-radius:16px;box-shadow:0 18px 50px #1630481a;overflow:hidden}.head{padding:30px 32px 24px;background:#12304a;color:#fff}.eyebrow{color:#a9c6da;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700}h1{margin:10px 0 8px;font-size:clamp(1.5rem,4vw,2rem)}.head p{margin:0;color:#d9e7f2;line-height:1.5}.form{display:grid;gap:18px;padding:28px 32px 24px}.form label{display:grid;gap:8px;font-size:.9rem;font-weight:650}.form input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #cbd5df;border-radius:8px;font:inherit;font-weight:400;color:#17212f;background:white}.form input:focus{outline:3px solid #2977a42e;border-color:#2977a4}.form input[type=file]{padding:9px;background:#f8fafc;font-size:.85rem}.form button,.primary-button{min-height:48px;border:0;border-radius:8px;background:#17648d;color:#fff;font:inherit;font-weight:700;cursor:pointer}.form button:hover,.primary-button:hover{background:#104f72}.form button:disabled,.primary-button:disabled{opacity:.6;cursor:wait}.hint{margin:-8px 0 0;color:#788695;font-size:.78rem;line-height:1.45}.results{padding:0 32px 20px}.results h2{margin:0 0 12px;font-size:1rem}.result-row{padding:14px 15px;margin-top:10px;border:1px solid #dce6ed;border-radius:9px;background:#f8fbfd}.result-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.listen{border:1px solid #bad0df;border-radius:7px;background:#fff;color:#155575;padding:6px 10px;font:inherit;font-size:.8rem;font-weight:650;cursor:pointer}.listen:hover{background:#eaf4f9}.code{display:inline-block;padding:4px 8px;border-radius:5px;background:#e4eff6;color:#12304a;font-weight:750;letter-spacing:.03em}.meaning{margin:0;color:#36475a;line-height:1.55;white-space:pre-wrap}.message{margin:0 32px 26px;padding:14px 16px;border-radius:8px;line-height:1.5}.success{color:#174e37;background:#edf8f1;border:1px solid #c8e8d3}.success p{margin:0 0 8px}.success p:last-child{margin:0}.success a{color:#115d3c;font-weight:700}.error{color:#8b1f1f;background:#fff0f0;border:1px solid #f0caca}.hidden{display:none!important}.report-actions{padding:0 32px 26px}.report-actions .primary-button{width:100%;padding:0 16px}.download-link{display:inline-block;margin-top:14px;color:#115d3c;font-weight:700}.status{margin:10px 0 0;font-size:.88rem}@media(max-width:480px){.head,.form{padding-left:22px;padding-right:22px}.results,.report-actions{padding-left:22px;padding-right:22px}.message{margin-left:22px;margin-right:22px}}
</style>
</head>
<body><main class="page"><section class="card"><header class="head"><span class="eyebrow">Vehicle service</span><h1>OBD Diagnostic Report</h1><p>Enter customer details and upload a diagnostic file to identify OBD-II codes.</p></header><form class="form" id="reportForm"><label>Customer name<input name="name" autocomplete="name" maxlength="100" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="30" required></label><label>Diagnostic file<input id="attachment" name="file" type="file" accept=".txt,.csv,.log,.pdf,.jpg,.jpeg,.png,.webp" required></label><p class="hint">Supports TXT, CSV, LOG, PDF, PNG, JPG, and WEBP files. No app-level size limit.</p><button type="submit" id="analyzeBtn">Find codes and meanings</button></form><div id="error" class="message error hidden" role="alert"></div><section id="results" class="results hidden" aria-live="polite"><h2>Codes found in file</h2><div id="resultRows"></div></section><section id="reportActions" class="report-actions hidden"><button id="generateBtn" class="primary-button" type="button">Generate PDF diagnostic report</button><p id="reportStatus" class="status" aria-live="polite"></p><a id="download" class="download-link hidden" download>Download diagnostic report (PDF)</a></section></section></main>
<script>
const API_BASE=location.protocol==='file:'?'http://localhost:4000':'';
const form=document.getElementById('reportForm');const fileInput=document.getElementById('attachment');const results=document.getElementById('results');const errorBox=document.getElementById('error');const reportActions=document.getElementById('reportActions');let findings=[];
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(text){if(!('speechSynthesis' in window)){errorBox.textContent='Speech playback is not supported by this browser.';errorBox.classList.remove('hidden');return}window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(text);voice.lang='en-US';window.speechSynthesis.speak(voice)}
function showError(message){errorBox.textContent=message;errorBox.classList.remove('hidden')}
fileInput.addEventListener('change',()=>{results.classList.add('hidden');reportActions.classList.add('hidden');errorBox.classList.add('hidden');findings=[]});
form.addEventListener('submit',async event=>{event.preventDefault();errorBox.classList.add('hidden');results.classList.add('hidden');reportActions.classList.add('hidden');findings=[];const file=fileInput.files[0];if(!file)return;const button=document.getElementById('analyzeBtn');button.disabled=true;button.textContent='Reading file and looking up codes…';try{const payload=new FormData();payload.append('file',file);const response=await fetch(`${API_BASE}/api/analyze-file`,{method:'POST',body:payload});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'The diagnostic file could not be analyzed.');findings=data.codes||[];if(!findings.length)throw new Error('No OBD-II codes were found in the selected file.');document.getElementById('resultRows').innerHTML=findings.map(({code,meaning},index)=>`<article class="result-row"><div class="result-top"><span class="code">${escapeHtml(code)}</span><button type="button" class="listen" data-index="${index}" aria-label="Listen to meaning for ${escapeHtml(code)}">▶ Listen</button></div><p class="meaning">${escapeHtml(meaning)}</p></article>`).join('');document.querySelectorAll('.listen').forEach(button=>button.addEventListener('click',()=>{const row=findings[Number(button.dataset.index)];speak(`${row.code}. ${row.meaning}`)}));results.classList.remove('hidden');reportActions.classList.remove('hidden')}catch(error){showError(error instanceof TypeError?'Could not reach the backend. Start it with npm start, then open http://localhost:4000.':(error.message||'Unable to analyze that file.'))}finally{button.disabled=false;button.textContent='Find codes and meanings'}});
document.getElementById('generateBtn').addEventListener('click',async()=>{errorBox.classList.add('hidden');const button=document.getElementById('generateBtn');const status=document.getElementById('reportStatus');const link=document.getElementById('download');button.disabled=true;button.textContent='Generating PDF…';status.textContent='';link.classList.add('hidden');try{const response=await fetch(`${API_BASE}/api/reports`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.elements.name.value,phone:form.elements.phone.value,codes:findings.map(row=>row.code)})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Could not generate the PDF.');status.textContent=`Report generated · Customer ID ${data.customerId}`;link.href=data.downloadUrl;link.classList.remove('hidden')}catch(error){showError(error instanceof TypeError?'Could not reach the backend. Start it with npm start, then open http://localhost:4000.':(error.message||'Unable to generate the PDF.'))}finally{button.disabled=false;button.textContent='Generate PDF diagnostic report'}});
</script></body></html>
